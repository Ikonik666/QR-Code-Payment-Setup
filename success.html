<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <title>Order Received - DesiTease</title>

  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    :root {
      --primary: #00d2ff;
      --primary-dark: #0984e3;
      --success: #00b894;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: linear-gradient(180deg, #e3f2fd 0%, #fdfbfb 100%);
      color: #000000;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }

    /* Slow Gentle Snow */
    .snowflake {
      position: fixed;
      top: -10px;
      background: white;
      border-radius: 50%;
      opacity: 0.7;
      pointer-events: none;
      box-shadow: 0 0 8px rgba(255,255,255,0.6);
      animation: fall linear infinite;
      z-index: 0;
    }
    @keyframes fall {
      0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 0.8; }
      100% { transform: translateY(110vh) translateX(40px) rotate(360deg); opacity: 0.2; }
    }

    .frost-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(ellipse at top, rgba(255,255,255,0.2) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
      animation: frostPulse 12s ease-in-out infinite;
    }
    @keyframes frostPulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.2; }
    }

    .success-container {
      max-width: 500px;
      width: 100%;
      background: white;
      border-radius: 24px;
      padding: 40px 30px;
      box-shadow: 0 20px 60px rgba(9, 132, 227, 0.15);
      text-align: center;
      position: relative;
      z-index: 1;
      border: 2px solid rgba(174, 214, 241, 0.3);
    }

    @media (max-width: 768px) {
      .success-container {
        padding: 35px 20px;
      }
    }

    /* Animated Success Icon */
    .success-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00b894 0%, #00cec9 100%);
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: successPop 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      box-shadow: 0 10px 30px rgba(0, 184, 148, 0.3);
    }

    @keyframes successPop {
      0% { transform: scale(0) rotate(-180deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .success-icon i {
      font-size: 2.5rem;
      color: white;
    }

    h1 {
      font-family: 'Baloo 2', cursive;
      font-size: 2rem;
      color: var(--success);
      margin-bottom: 30px;
      font-weight: 800;
    }

    /* Order Summary */
    .order-box {
      background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
      border: 2px solid #e8f4fd;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 25px;
      text-align: left;
    }

    .order-title {
      font-size: 0.85rem;
      color: #636e72;
      margin-bottom: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .order-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid rgba(0,0,0,0.06);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .order-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .order-total {
      display: flex;
      justify-content: space-between;
      padding-top: 15px;
      margin-top: 15px;
      border-top: 2px solid var(--primary-dark);
      font-size: 1.2rem;
      color: var(--primary-dark);
      font-weight: 900;
    }

    /* Fast Track Box */
    .fast-track-box {
      background: linear-gradient(135deg, #e8f9f3 0%, #d4f4e8 100%);
      border: 2px solid #00b894;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      text-align: center;
    }

    .fast-track-title {
      font-size: 1.1rem;
      color: #000000;
      margin-bottom: 10px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .fast-track-desc {
      font-size: 0.85rem;
      color: #2d3436;
      margin-bottom: 18px;
      line-height: 1.5;
      font-weight: 500;
    }

    .btn-telegram {
      width: 100%;
      background: linear-gradient(135deg, #0088cc 0%, #229ED9 100%);
      color: white;
      border: none;
      padding: 16px 20px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 5px 20px rgba(0, 136, 204, 0.3);
    }

    .btn-telegram:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 136, 204, 0.5);
    }

    .btn-telegram i {
      font-size: 1.2rem;
    }

    /* Manual Wait Box */
    .manual-box {
      background: linear-gradient(135deg, #fff9e6 0%, #fff4d6 100%);
      border: 2px solid #ffd93d;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 25px;
      text-align: center;
    }

    .manual-text {
      font-size: 0.85rem;
      color: #2d3436;
      font-weight: 600;
      line-height: 1.5;
    }

    /* Footer Links */
    .footer-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      padding-top: 20px;
      border-top: 1px solid #f1f2f6;
    }

    .footer-link {
      font-size: 0.85rem;
      color: var(--primary-dark);
      text-decoration: none;
      font-weight: 700;
      transition: all 0.3s ease;
    }

    .footer-link:hover {
      transform: scale(1.05);
    }

    .social-link-telegram {
      background: linear-gradient(135deg, #0088cc 0%, #229ED9 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .social-link-instagram {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
  </style>
</head>

<body>
  <div class="frost-overlay"></div>
  <div id="snow-container"></div>

  <div class="success-container">
    <div class="success-icon">
      <i class="fas fa-check"></i>
    </div>

    <h1>Order Received! 🎉</h1>

    <!-- ORDER SUMMARY -->
    <div class="order-box">
      <div class="order-title">📦 Your Order</div>
      <div id="orderItems">
        <!-- Dynamically filled -->
      </div>
    </div>

    <!-- FAST TRACK TELEGRAM -->
    <div class="fast-track-box">
      <div class="fast-track-title">
        <i class="fas fa-bolt"></i>
        <span>Fast Track (Recommended)</span>
      </div>
      <p class="fast-track-desc">
        Click below to send your order details directly on Telegram. Helps us verify faster and get you access immediately!
      </p>
      <a href="#" id="telegramBtn" class="btn-telegram">
        <i class="fab fa-telegram-plane"></i>
        <span>Send Order To Admin</span>
      </a>
    </div>

    <!-- MANUAL WAIT -->
    <div class="manual-box">
      <p class="manual-text">
        Or wait for us to come online and verify manually. Usually takes 5-30 minutes.
      </p>
    </div>

    <!-- FOOTER LINKS -->
    <div class="footer-links">
      <a href="https://t.me/DesiTease_2" target="_blank" class="footer-link social-link-telegram">
        <i class="fab fa-telegram-plane"></i> Telegram
      </a>
      <a href="https://instagram.com/desitease_" target="_blank" class="footer-link social-link-instagram">
        <i class="fab fa-instagram"></i> Instagram
      </a>
      <a href="index.html" class="footer-link">
        <i class="fas fa-home"></i> Home
      </a>
    </div>
  </div>

  <script>
  // Item data for detailed bundle matching
  const itemData = {
    'pdf': { name: 'PDF Stories Pack', price: 103 },
    'mms': { name: 'Viral MMS Pack', price: 149 },
    'audio': { name: 'Audio Erotica', price: 139 },
    'animated': { name: 'Animated 3D Pack', price: 169 },
    'bbc': { name: 'BBC Pack', price: 189 },
    'ai': { name: 'AI App Pack', price: 149 },
    'spy': { name: 'Spy Cam Vault', price: 199 },
    'incest': { name: 'Incest Pack', price: 219 },
    'secret': { name: 'Secret Vault', price: 260 },
    'actress': { name: 'Actress Pack', price: 349 }
  };

  function loadOrder() {
    // Try to get data from localStorage first (most reliable)
    const storedData = localStorage.getItem('desiOrder');
    
    if (storedData) {
      const order = JSON.parse(storedData);
      displayOrder(order.items, order.total);
    } else {
      // Fallback to URL params if localStorage fails
      const urlParams = new URLSearchParams(window.location.search);
      const itemsParam = urlParams.get('items');
      const amountParam = urlParams.get('amount');
      
      if (itemsParam && amountParam) {
        const items = itemsParam.split(',').map(id => {
          const data = itemData[id.trim()];
          return data ? { id: id.trim(), ...data } : null;
        }).filter(Boolean);
        displayOrder(items, '₹' + amountParam);
      } else {
        document.getElementById('orderItems').innerHTML = '<div class="order-item"><span>Order details not found.</span></div>';
      }
    }
  }

  function displayOrder(items, totalAmount) {
    const container = document.getElementById('orderItems');
    const itemIds = items.map(i => i.id);
    const itemCount = itemIds.length;

    // Detect bundles
    let isMegaBundle = itemCount === 10;
    let isTopPicksBundle = itemCount === 2 && itemIds.includes('pdf') && itemIds.includes('mms');
    let isTrendingBundle = itemCount === 4 && itemIds.includes('audio') && itemIds.includes('animated') && itemIds.includes('bbc') && itemIds.includes('ai');
    let isForbiddenBundle = itemCount === 4 && itemIds.includes('spy') && itemIds.includes('incest') && itemIds.includes('secret') && itemIds.includes('actress');

    let html = '';

    if (isMegaBundle) {
      html += `
        <div class="order-item">
          <span><strong>🔥 ULTIMATE WINTER BUNDLE</strong><br><small style="font-size: 0.75rem; color: #636e72;">All 10 Premium Packs</small></span>
          <span style="color: var(--gold); font-weight: 900;">₹1499</span>
        </div>`;
    } else if (isTopPicksBundle) {
      html += `
        <div class="order-item">
          <span><strong>🔥 Top Picks Bundle</strong><br><small style="font-size: 0.75rem; color: #636e72;">PDF Stories + Viral MMS</small></span>
          <span>₹202</span>
        </div>`;
    } else if (isTrendingBundle) {
      html += `
        <div class="order-item">
          <span><strong>⚡ Trending Bundle</strong><br><small style="font-size: 0.75rem; color: #636e72;">Audio + 3D + BBC + AI App</small></span>
          <span>₹517</span>
        </div>`;
    } else if (isForbiddenBundle) {
      html += `
        <div class="order-item">
          <span><strong>💀 Forbidden Vault Bundle</strong><br><small style="font-size: 0.75rem; color: #636e72;">Spy + Incest + Secret + Actress</small></span>
          <span>₹822</span>
        </div>`;
    } else {
      items.forEach(item => {
        html += `
          <div class="order-item">
            <span>${item.name}</span>
            <span>₹${item.price}</span>
          </div>`;
      });
    }

    html += `
      <div class="order-total">
        <span>Total Paid</span>
        <span>${totalAmount}</span>
      </div>`;

    container.innerHTML = html;
    generateTelegramLink(items, totalAmount, isMegaBundle, isTopPicksBundle, isTrendingBundle, isForbiddenBundle);
  }

  function generateTelegramLink(items, amount, isMega, isTopPicks, isTrending, isForbidden) {
    let itemsList = '';

    if (isMega) itemsList = '• ULTIMATE WINTER BUNDLE - ₹1499 (All 10 Packs)';
    else if (isTopPicks) itemsList = '• Top Picks Bundle - ₹202 (PDF + MMS)';
    else if (isTrending) itemsList = '• Trending Bundle - ₹517 (Audio + 3D + BBC + AI)';
    else if (isForbidden) itemsList = '• Forbidden Vault Bundle - ₹822 (Spy + Incest + Secret + Actress)';
    else itemsList = items.map(i => `• ${i.name} - ₹${i.price}`).join('\n');

    // Clean amount string (remove ₹ if present twice)
    const cleanAmount = amount.replace('₹', '');

    const message = `Hi DesiTease! 👋

I just paid: ₹${cleanAmount}

📦 My Order:
${itemsList}

Please verify my payment screenshot and send access! 🚀`;

    const encodedMessage = encodeURIComponent(message);
    document.getElementById('telegramBtn').href = `https://t.me/DesiTease_2?text=${encodedMessage}`;
  }

  // Create snow effect
  function createSnow() {
    const container = document.getElementById('snow-container');
    const count = 30;
    for(let i=0; i<count; i++) {
      const snow = document.createElement('div');
      snow.className = 'snowflake';
      snow.style.left = Math.random() * 100 + 'vw';
      snow.style.width = snow.style.height = (Math.random() * 5 + 4) + 'px';
      snow.style.animationDuration = (Math.random() * 10 + 12) + 's';
      snow.style.animationDelay = (Math.random() * 10) + 's';
      container.appendChild(snow);
    }
  }

  window.onload = function() {
    loadOrder();
    createSnow();
  };
</script>

</body>
</html>
